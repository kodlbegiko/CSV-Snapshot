name: Apply Ruff Fixes

on:
  push:
    branches: [feat/csv-snapshot-v0.1.0]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor == 'kodlbegiko'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/csv-snapshot-v0.1.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "ruff==0.15.22"
      - run: ruff check --fix --unsafe-fixes .
      - run: ruff format .
      - run: ruff check .
      - name: Commit exact Ruff output
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: apply Ruff fixes and formatting"
          git push origin HEAD:feat/csv-snapshot-v0.1.0
