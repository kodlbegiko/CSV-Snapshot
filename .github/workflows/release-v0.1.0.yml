name: Release CSV Snapshot v0.1.0

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.title == 'chore: trigger CSV Snapshot v0.1.0 release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c98288023c7988698b2c7c1694a8679f5c525ab1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest --cov=csv_snapshot --cov-branch --cov-report=term-missing
      - run: python -m build
      - run: twine check dist/*
      - name: Create immutable tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.0 dist/*.whl dist/*.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --target c98288023c7988698b2c7c1694a8679f5c525ab1 \
            --title "CSV Snapshot v0.1.0" \
            --notes "CSV Snapshot v0.1.0 introduces deterministic local CSV quality snapshots, schema and metric drift detection, privacy-aware aggregate output, validated TOML thresholds, terminal/JSON/Markdown reports, CI exit codes, a reusable composite action, and cross-platform Python 3.11/3.12 validation. Installation is available from this GitHub tag or the attached wheel/sdist. Known limitations: UTF-8/UTF-8 BOM only, required headers, single-character delimiters, ISO date inference, and no PyPI publication. Breaking changes: None."
