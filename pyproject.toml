[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-snapshot"
version = "0.1.0"
description = "Create deterministic CSV quality snapshots and catch data drift in CI."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "CSV Snapshot contributors" }]
keywords = ["csv", "data-quality", "data-drift", "ci", "snapshot"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "pydantic>=2.8,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5",
  "ruff>=0.8",
  "twine>=5.1",
]

[project.scripts]
csv-snapshot = "csv_snapshot.cli:main"

[project.urls]
Homepage = "https://github.com/kodlbegiko/CSV-Snapshot"
Repository = "https://github.com/kodlbegiko/CSV-Snapshot"
Issues = "https://github.com/kodlbegiko/CSV-Snapshot/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
csv_snapshot = ["py.typed", "snapshot-schema.json"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["csv_snapshot"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = false
packages = ["csv_snapshot"]
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
